<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ISM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,800;1,800;1,900&display=swap" />
  <style>
    :root {
      --crimson: #bc2534; --text: #201e1d; --muted: #959191; --border: #d8d5d4;
      --font: 'Archivo', Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #fff; color: var(--text);
      font-family: var(--font); display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    .mark { display: flex; align-items: baseline; gap: 12px; font-style: italic; font-weight: 900; text-transform: uppercase; }
    .mark .ism { color: var(--crimson); font-size: 1.25rem; }
    .mark .bar { width: 2px; height: 0.9em; background: var(--border); transform: translateY(0.08em); }
    h1 { font-style: italic; font-weight: 800; font-size: clamp(2rem, 6vw, 3rem); line-height: 0.95; margin: 24px 0 12px; letter-spacing: -0.01em; }
    p { font-size: 1.0625rem; line-height: 1.55; color: var(--muted); margin: 0 0 24px; }
    a.cta {
      display: inline-flex; align-items: center; gap: 8px;
      font-style: italic; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
      font-size: 0.9375rem; text-decoration: none;
      padding: 12px 20px; border: 2px solid var(--crimson); background: var(--crimson); color: #fff;
    }
    a.cta:hover { background: #800015; border-color: #800015; }
    hr { border: 0; border-top: 2px solid var(--text); margin: 32px 0 0; }
    .foot { font-size: 0.8125rem; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark"><span class="ism">ISM</span><span class="bar"></span><span>Impact System Marketing</span></div>
    <h1>Nothing to see here&nbsp;yet.</h1>
    <p>This domain hosts internal Impact System Marketing tools.</p>
    <a class="cta" href="/solutions/">Solution Ideas &rarr;</a>
    <hr />
    <p class="foot">impactsystemmarketing.com</p>
  </main>
</body>
</html>
